# Amp-in-a-box security proxy
# Only allows traffic to known Amp endpoints

# --- Network Settings ---
# Intercept HTTP
http_port 3129 intercept

# Intercept HTTPS (SslBump)
https_port 3130 intercept ssl-bump cert=/etc/squid/ssl/squid.pem generate-host-certificates=on dynamic_cert_mem_cache_size=4MB

# Helper for dynamic certificate generation
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB
sslcrtd_children 5

# --- ACL Definitions ---

# Allowed sites (splice - no MITM, direct passthrough)
acl allowed_sites ssl::server_name "/etc/squid/allowlist.txt"

# Standard Access Lists
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src 127.0.0.1
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# For HTTP filtering
acl allowed_http dstdomain "/etc/squid/allowlist.txt"

# --- Access Rules ---

# Deny unsafe ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Allow HTTP to allowlisted domains
http_access allow allowed_http

# Allow all HTTPS through - filtering at ssl_bump level after peek
http_access allow SSL_ports

http_access deny all

# --- SSL Bump Logic ---

# Step ACL for ssl_bump
acl step1 at_step SslBump1

# 1. Peek at the client hello to see the requested SNI
ssl_bump peek step1

# 2. Splice (passthrough) allowed sites
ssl_bump splice allowed_sites

# 3. Terminate everything else
ssl_bump terminate all

# --- Other Settings ---
coredump_dir /var/spool/squid

# Logging with SNI
access_log stdio:/var/log/squid/access.log combined
cache_log /var/log/squid/cache.log

# Minimal caching
cache deny all
